<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<title>CUPRUM · Copper Intelligence Terminal</title>
<style>
  :root{
    --bg:#131010; --panel:#1b1613; --panel-2:#221b16; --raise:#271f19;
    --line:#302720; --line-2:#3f342b;
    --ink:#f3ebe1; --ink-2:#bdac9d; --ink-3:#8a7b6d;
    --copper:#d67c3f; --copper-2:#e6a163; --bronze:#b8843f;
    --good:#4cc088; --warn:#e0a94e;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
  .app{display:flex;flex-direction:column;height:100vh;min-height:100vh}
  header{flex:0 0 auto;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel-2),var(--panel));padding:10px 18px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px}
  .mark{font-family:var(--mono);font-weight:600;letter-spacing:.42em;font-size:19px;color:var(--copper-2);text-indent:.42em}
  .sub{font-size:10.5px;color:var(--ink-3);letter-spacing:.16em;text-transform:uppercase}
  .proto{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--warn);border:1px solid #4a3a1e;background:#241c0f;padding:3px 8px;border-radius:999px;text-transform:uppercase}
  nav{display:flex;gap:4px;margin-left:6px;flex-wrap:wrap}
  .tab{background:transparent;border:1px solid var(--line);color:var(--ink-2);font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-radius:8px;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:8px}
  .tab:hover{color:var(--ink);border-color:var(--line-2);background:var(--raise)}
  .tab.active{color:var(--copper-2);border-color:var(--bronze);background:#2a1f14}
  .tab .n{font-size:9.5px;color:var(--ink-3);letter-spacing:.14em}
  .tab.active .n{color:var(--copper)}
  .live{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(76,192,136,.18);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  main{flex:1 1 auto;position:relative;overflow:hidden}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);opacity:0;transition:opacity .18s ease}
  iframe.active{opacity:1;z-index:2}
  .caption{padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.06em;background:var(--panel);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .caption b{color:var(--ink-2);font-weight:500}
  @media(max-width:720px){
    header{padding:10px 12px;gap:12px}
    .brand .sub{display:none}
    .live{width:100%;margin-left:0;order:3}
    .tab{padding:7px 10px;font-size:10.5px}
  }
</style>

<div class="app">
  <header>
    <div class="brand">
      <div class="mark">CUPRUM</div>
      <div class="sub">Copper Intelligence Terminal</div>
    </div>
    <span class="proto">Prototype · Illustrative Data</span>
    <nav id="nav">
      <button class="tab active" data-view="terminal"><span class="n">01</span> Terminal</button>
      <button class="tab" data-view="deficit"><span class="n">02</span> Deficit Engine</button>
      <button class="tab" data-view="supply"><span class="n">03</span> Supply Map</button>
    </nav>
    <div class="live"><span class="dot"></span> Session Live</div>
  </header>
  <main>
    <iframe id="v-terminal" src="cuprum.html" class="active" title="Copper Terminal"></iframe>
    <iframe id="v-deficit" src="deficit-engine.html" title="Electrification Deficit Engine" loading="lazy"></iframe>
    <iframe id="v-supply" src="supply-map.html" title="Global Supply Map" loading="lazy"></iframe>
  </main>
  <div class="caption">
    <div><b id="cap-title">01 · Dashboard</b> — Price, curve, inventories, TC/RC, positioning, conviction engine</div>
    <div>Dr. Copper · LME · COMEX · SHFE</div>
  </div>
</div>

<script>
  const CAPTIONS = {
    terminal: {t:'01 · Dashboard', d:'Price, curve, inventories, TC/RC, positioning, conviction engine'},
    deficit:  {t:'02 · Deficit Engine', d:'2025–2030 supply/demand scenario builder with Monte Carlo bands'},
    supply:   {t:'03 · Supply Map', d:'Mines, smelters, concentrate flows, corridors and chokepoints'}
  };
  const tabs = document.querySelectorAll('.tab');
  const frames = {terminal:document.getElementById('v-terminal'), deficit:document.getElementById('v-deficit'), supply:document.getElementById('v-supply')};
  const cap = document.getElementById('cap-title');
  const capParent = cap.parentElement;
  function show(view){
    tabs.forEach(t=>t.classList.toggle('active', t.dataset.view===view));
    Object.entries(frames).forEach(([k,f])=>f.classList.toggle('active', k===view));
    cap.textContent = CAPTIONS[view].t;
    capParent.childNodes[1].textContent = ' — ' + CAPTIONS[view].d;
    history.replaceState(null,'','#'+view);
  }
  tabs.forEach(t=>t.addEventListener('click', ()=>show(t.dataset.view)));
  const initial = (location.hash||'').replace('#','');
  if(initial && CAPTIONS[initial]) show(initial);
</script>
